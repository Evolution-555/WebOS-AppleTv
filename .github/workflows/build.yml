name: Build IPK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Node 8 and Chromium builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/cleanyourtv
          key: cytv-engines-${{ runner.os }}-node8.12.0-chromium555668-706915

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          for p in libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libgtk-3-0t64 libxss1 libxtst6 fonts-liberation; do sudo apt-get install -y -qq $p >/dev/null 2>&1 || echo "not installed: $p"; done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Run checks
        run: sh tools/check.sh --chromium

      - name: Build IPK
        env:
          CYTV_REPO: ${{ github.repository }}
          CYTV_TAG: v1.0.0
        run: |
          python3 ipk/build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-files
          path: dist/*
          retention-days: 30
