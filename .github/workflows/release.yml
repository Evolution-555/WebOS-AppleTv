# Release workflow for AppleTv CleanYourTV
# Triggered by tag push (e.g., v1.0.0)
name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          for p in libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libgtk-3-0t64 libxss1 libxtst6 fonts-liberation; do sudo apt-get install -y -qq $p >/dev/null 2>&1 || echo "not installed: $p"; done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Run checks
        run: sh tools/check.sh --chromium || true

      - name: Build IPK
        env:
          CYTV_REPO: ${{ github.repository }}
          CYTV_TAG: ${{ github.ref_name }}
        run: |
          python3 ipk/build.py

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "AppleTv Edition $TAG" --notes "## AppleTv Edition $TAG

CleanYourTV with AppleTv theme as default.

### Features
- Authentic Apple TV design
- Glassmorphism effects
- Spring animations
- 4K optimized (3840x2160)
- Sound design integration
- San Francisco typography

### Installation
Add this repository to Homebrew Channel:
https://github.com/Evolution-555/WebOS-AppleTv/releases/latest/download/apps.json

### Changes
See commit history for full changelog." \
            dist/*.ipk dist/*.ipk.sha256 dist/*.tgz dist/*.tgz.sha256 dist/apps.json dist/*.manifest.json
